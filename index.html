    <script type="text/javascript">
        // Decodes the query-string-encoded path 404.html produced for a deep
        // link GitHub Pages couldn't resolve server-side, back into a real
        // path via history.replaceState — before Vue Router reads the URL.
        // Pair of https://github.com/rafgraph/spa-github-pages. No-op on a
        // normal load (search[1] isn't "/").
        (function (l) {
            if (l.search[1] === "/") {
                var decoded = l.search.slice(1).split("&").map(function (s) {
                    return s.replace(/~and~/g, "&");
                }).join("?");
                window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
            }
        })(window.location);
    </script>
    <script>
        // Apply the saved/preferred color scheme before first paint so there's
        // no flash of the wrong theme while Vue boots (see src/theme.ts, which
        // this mirrors and then takes over reactively — including live OS
        // theme changes — once the app mounts).
        (function () {
            try {
                var stored = localStorage.getItem("sileo-landing-theme");
                var theme = stored === "light" || stored === "dark"
                    ? stored
                    : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
