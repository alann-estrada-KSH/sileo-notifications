<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Sileo</title>
    <script type="text/javascript">
        // GitHub Pages has no server-side rewrite, so a deep link like
        // /sileo-notifications/docs/getting-started 404s at the edge before
        // the SPA ever loads. This is the standard spa-github-pages trick:
        // re-encode the path into a query string 404.html can redirect with,
        // then index.html's matching script decodes it back into a real path
        // via history.replaceState before Vue Router reads the URL.
        // See https://github.com/rafgraph/spa-github-pages
        var pathSegmentsToKeep = 1; // "/sileo-notifications" is the project-page segment to preserve
        var l = window.location;
        l.replace(
            l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
            l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
